<html lang="es"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
    <style>
  
        body {
            font-family: 'Jersey 10', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, #008080, #00BFFF);
            color: #333;
        }


        .form-container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            max-width: 500px;
            width: 100%;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .form-container:hover {
            transform: scale(1.02);
        }

        h1 {
            color: #008080;
            margin-bottom: 20px;
            font-size: 2.5rem;
        }

      
        .form-field {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 1rem;
            outline: none;
            transition: border 0.3s;
        }

        .form-field:focus {
            border-color: #008080;
        }

    
        #universidad {
            margin-bottom: 15px;
        }

     
        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #008080;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 1.2rem;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
        }

        .submit-btn:hover {
            background-color: #00BFFF;
            transform: scale(1.05);
        }

     
        .thank-you-message {
            display: none;
            font-size: 1.5rem;
            color: #008080;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h1>Formulario de Registro</h1>
 

        <form id="registrationForm">
            <input type="text" class="form-field" id="nombre" placeholder="Nombre" required>
            <input type="text" class="form-field" id="apellido" placeholder="Apellido" required>
            <input type="text" class="form-field" id="carrera" placeholder="Carrera Universitaria" required>
            <input type="text" class="form-field" id="universidad" placeholder="Universidad" required>
            <input type="color" class="form-field" id="color" title="Elige tu color favorito" required>

            <button type="submit" class="submit-btn">Enviar</button>
        </form>

  
        <div class="thank-you-message" id="thankYouMessage">
            Gracias por registrarte! Pronto te contactaremos...
        </div>
    </div>

    <script>
    
        const form = document.getElementById('registrationForm');
        const thankYouMessage = document.getElementById('thankYouMessage');

        form.addEventListener('submit', function(event) {
            event.preventDefault(); 
            form.style.display = 'none';
            thankYouMessage.style.display = 'block'; 
        });
    </script>

</body>
</html>
