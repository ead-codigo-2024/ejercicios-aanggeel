<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicios Diseño desde el Código</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jersey+10&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Jersey 10', sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(to bottom, #003366, #ffffff);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            color: #003366;
        }

        header {
            width: 100%;
            text-align: center;
            padding: 30px 0;
            background-color: #003366;
            color: white;
            font-size: 2.5rem;
        }

        h1 {
            margin: 0;
            font-size: 3rem;
        }

        .intro-text {
            font-size: 1.5rem;
            margin: 20px 0;
            color: #ffffff;
            text-align: center;
        }

        .cuadro-enlaces {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 30px;
        }

        .cuadro-enlaces a {
            background-color: #003366;
            color: white;
            text-decoration: none;
            font-size: 2rem;
            width: 300px;
            height: 250px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 15px;
            border: 2px solid #ffffff;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            transition: background-color 0.3s, transform 0.2s;
        }

        .cuadro-enlaces a:hover {
            background-color: #0066cc;
            transform: scale(1.1);
        }

        .cuadro-enlaces img {
            width: 200px;
            height: 200px;
            margin-bottom: 20px;
            border-radius: 5px;
            object-fit: cover;
        }

        .cuadro-enlaces span {
            font-size: 2.5rem;
            font-weight: bold;
            color: #ffffff;
            position: absolute;
            top: 10px;
            left: 10px;
        }

        .contacto {
            display: flex;
            gap: 30px;
            padding: 20px 0;
            background-color: #f4f4f4;
            width: 100%;
            justify-content: center;
            font-size: 1.2rem;
        }

        .contacto a {
            color: #0066cc;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s;
        }

        .contacto a:hover {
            color: #004d99;
        }
    </style>
</head>
<body>

    <header>
        <h1>Ejercicios Diseño desde el Código</h1>
    </header>

    <div class="intro-text">
        Hola, Soy Ángel Pizarro y estos son mis ejercicios realizados en esta asignatura!
    </div>

    <div class="cuadro-enlaces">
        <a href="ejercicio-1/index.html">
            <img src="ejercicio-1-preview.png" alt="Vista previa Ejercicio 1">
            <span>1</span>
        </a>
        <a href="ejercicio-2.1/actividad-1.html">
            <img src="ejercicio-2-preview.png" alt="Vista previa Ejercicio 2">
            <span>2</span>
        </a>
        <a href="ejercicio-3/actividad-3-.html">
            <img src="ejercicio-3-preview.png" alt="Vista previa Ejercicio 3">
            <span>3</span>
        </a>
        <a href="ejercicio-4/actividad-4.html">
            <img src="ejercicio-4-preview.png" alt="Vista previa Ejercicio 4">
            <span>4</span>
        </a>
    </div>

    <ul class="contacto">
        <li><a href="mailto:angel.pizarro.c@mail.pucv.cl">Correo Electronico</a></li>
        <li><a href="tel:+56959088252">Número Telefónico</a></li>
    </ul>

</body>
</html>
