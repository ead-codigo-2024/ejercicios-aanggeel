<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noticias</title>
    <link rel="stylesheet" href="styles.css">
    <style> 
        /* Estilos base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Sección de noticias */
        .news-section {
            max-width: 1200px;
            width: 100%;
            margin: 50px auto;
            padding: 0 20px;
        }

        h2 {
            font-size: 2rem;
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }

        .highlight {
            color: #f7b500;
        }

        /* Grid de noticias */
        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        /* Tarjetas de noticias */
        .news-card {
            background-color: #fff;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            overflow: hidden;
            transition: transform 0.3s, box-shadow 0.3s;
            position: relative;
        }

        .news-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.2);
        }

        .category {
            background-color: #1a73e8;
            color: #fff;
            padding: 5px 10px;
            font-size: 0.9rem;
            position: absolute;
            top: 15px;
            left: 15px;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .news-image {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .news-content {
            padding: 15px 20px;
        }

        h3 {
            font-size: 1.2rem;
            margin-bottom: 10px;
            color: #333;
        }

        p {
            font-size: 1rem;
            color: #555;
            margin-bottom: 10px;
        }

        /* Enlace "Ver todas las noticias" */
        .view-all {
            display: inline-block;
            margin: 20px auto;
            font-size: 1rem;
            color: #1a73e8;
            text-decoration: none;
            padding: 10px 20px;
            border: 1px solid #1a73e8;
            border-radius: 5px;
            transition: background-color 0.3s, color 0.3s;
            text-align: center;
        }

        .view-all:hover {
            background-color: #1a73e8;
            color: #fff;
        }
    </style>
</head>
<body>

    <section class="news-section">
        <h2>Te contamos <span class="highlight">—</span></h2>
        <div class="news-grid">
            <!-- Card 1 -->
            <div class="news-card">
                <span class="category">Iglesia</span>
                <img src="iglesia.jpg" alt="Imagen de la noticia de la iglesia" class="news-image">
                <div class="news-content">
                    <h3>Rector UC</h3>
                    <p>La dignidad primero</p>
                </div>
            </div>
            <!-- Card 2 -->
            <div class="news-card">
                <span class="category">Tecnología</span>
                <img src="sistemas digitales.png" alt="Imagen sobre la nueva plataforma digital" class="news-image">
                <div class="news-content">
                    <h3>UC lanza nueva plataforma digital</h3>
                    <p>Para impulsar la ciberseguridad</p>
                </div>
            </div>
            <!-- Card 3 -->
            <div class="news-card">
                <span class="category">Elección de Rector</span>
                <img src="rector.png" alt="Imagen sobre el nombramiento del comité de búsqueda" class="news-image">
                <div class="news-content">
                    <h3>Gran Canciller de la UC nombra...</h3>
                    <p>A los cuatro miembros que se integran al Comité de Búsqueda</p>
                </div>
            </div>
        </div>
        <a href="#" class="view-all">Ver todas las noticias</a>
    </section>

</body>
</html>
